purpose: "Canonical route/path registry for controller build and package validation."

rules:
  - "The controller returns the references required for the committed stage; the runtime router does not need to load this registry."
  - "Only causal_check loads method_route_catalog.yaml when method recommendation is needed."
  - "Every callable route and every controller-returned or conditionally loaded reference or asset must have a path in this index."

core_routes:
  - id: team_lead
    path: references/team_lead.md
  - id: data_audit
    path: references/data_audit.md
  - id: domain_expert
    path: references/domain_expert.md
  - id: causal_discovery
    path: references/causal_discovery.md
  - id: causal_check
    path: references/causal_check.md
  - id: report_writer
    path: references/report_writer.md

method_routes_catalog:
  path: references/method_route_catalog.yaml
  loaded_by: causal_check

shared_references:
  - id: route_selection_workflow
    path: references/route_selection_workflow.md
    loaded_by: controller_for_router_phase
  - id: report_routing_workflow
    path: references/report_routing_workflow.md
    loaded_by: router_when_report_needed
  - id: analysis_routing_workflow
    path: references/analysis_routing_workflow.md
    loaded_by: router_when_analysis_execution_needed
  - id: team_lead_report_flow
    path: references/team_lead_report_flow.md
    loaded_by: team_lead_when_report_needed
  - id: team_lead_analysis_flow
    path: references/team_lead_analysis_flow.md
    loaded_by: team_lead_when_analysis_needed
  - id: team_lead_questions
    path: references/team_lead_questions.md
    loaded_by: controller_when_open_carried_questions_or_handoff_questions_else_team_lead_on_synthesis
  - id: team_lead_audience
    path: references/team_lead_audience.md
    loaded_by: controller_while_audience_level_unstated_else_team_lead_on_new_evidence
  - id: artifact_output_policy
    path: references/artifact_output_policy.md
    loaded_by: worker_when_creating_output
  - id: design_execution_contract
    path: references/design_execution_contract.md
    loaded_by: design_references
  - id: legacy_evidence
    path: references/legacy_evidence.md
    loaded_by: controller_when_active_completion_protocol_1_or_team_lead_when_reviewing_historical_manifest
  - id: context_transport
    path: references/context_transport.md
    loaded_by: host_when_isolated_invocations_or_context_file

conditional_assets:
  - id: report_template_analysis
    path: assets/report_template_analysis.md
    loaded_by: controller_when_output_bound_report_scope_binds_analysis_artifact_ids
  - id: report_template_planning
    path: assets/report_template_planning.md
    loaded_by: controller_when_output_bound_report_analysis_artifact_ids_are_empty
  - id: report_html_layout_template
    path: assets/report_html_layout_template.html
    loaded_by: controller_when_output_bound_report

method_routes:
  - id: randomized_assignment
    path: references/design/randomized_assignment.md
    category: design
  - id: single_time_observational
    path: references/design/single_time_observational.md
    category: design
  - id: longitudinal_gmethods
    path: references/design/longitudinal_gmethods.md
    category: design
  - id: difference_in_differences
    path: references/design/difference_in_differences.md
    category: design
  - id: regression_discontinuity
    path: references/design/regression_discontinuity.md
    category: design
  - id: instrumental_variables
    path: references/design/instrumental_variables.md
    category: design
  - id: synthetic_control_time_series
    path: references/design/synthetic_control_time_series.md
    category: design
  - id: interference_spillovers
    path: references/design/interference_spillovers.md
    category: design
  - id: descriptive_association
    path: references/design/descriptive_association.md
    category: design
  - id: heterogeneous-effects
    path: references/support/heterogeneous-effects.md
    category: support
  - id: dose-response
    path: references/support/dose-response.md
    category: support
  - id: mediation
    path: references/support/mediation.md
    category: support
  - id: policy-making-and-transportability
    path: references/support/policy-making-and-transportability.md
    category: support
  - id: non-continuous-outcomes
    path: references/support/non-continuous-outcomes.md
    category: support
  - id: statistical-validity
    path: references/support/statistical-validity.md
    category: support
